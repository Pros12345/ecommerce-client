<div class="profile-page">

    <div class="profile-card">

        <!-- HEADER -->

        <div class="profile-header">

            <div class="profile-icon">
                👤
            </div>

            <div>
                <h2>My Profile</h2>

                <p>
                    Manage your account details
                </p>
            </div>

        </div>


        <!-- SUCCESS -->

        <div class="success-message" *ngIf="successMessage">

            {{ successMessage }}

        </div>


        <!-- ERROR -->

        <div class="error-message" *ngIf="errorMessage">

            {{ errorMessage }}

        </div>


        <!-- PROFILE DETAILS -->

        <form [formGroup]="profileForm" (ngSubmit)="updateProfile()">

            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input type="text" formControlName="firstName" placeholder="Enter your name">

                <small *ngIf="
            profileForm.get('firstName')?.invalid &&
            profileForm.get('firstName')?.touched
          ">

                    Name is required.

                </small>

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email" formControlName="email" placeholder="Enter your email">

                <small *ngIf="
            profileForm.get('email')?.invalid &&
            profileForm.get('email')?.touched
          ">

                    Please enter a valid email.

                </small>

            </div>


            <div class="form-group">

                <label>
                    Mobile Number
                </label>

                <div class="mobile-container">

                    <select formControlName="countryCode">

                        <option value="+91">
                            🇮🇳 +91
                        </option>

                        <option value="+1">
                            🇺🇸 +1
                        </option>

                        <option value="+44">
                            🇬🇧 +44
                        </option>

                        <option value="+61">
                            🇦🇺 +61
                        </option>

                        <option value="+971">
                            🇦🇪 +971
                        </option>

                    </select>


                    <input type="tel" formControlName="mobileNumber" maxlength="10" placeholder="Mobile number">

                </div>

            </div>


            <button type="submit" class="save-button" [disabled]="savingProfile">

                {{ savingProfile
                ? 'Saving...'
                : 'Save Changes'
                }}

            </button>

        </form>


        <!-- PASSWORD -->

        <div class="password-section">

            <button type="button" class="password-toggle" (click)="togglePasswordSection()">

                {{ showPasswordSection
                ? 'Cancel Change Password'
                : 'Change Password'
                }}

            </button>


            <form *ngIf="showPasswordSection" [formGroup]="passwordForm" (ngSubmit)="changePassword()">


                <!-- CURRENT PASSWORD -->

                <div class="form-group">

                    <label>
                        Current Password
                    </label>

                    <div class="password-container">

                        <input [type]="
                showCurrentPassword
                  ? 'text'
                  : 'password'
              " formControlName="currentPassword" placeholder="Enter current password">

                        <button type="button" class="eye-button" (click)="
                showCurrentPassword =
                !showCurrentPassword
              ">

                            {{ showCurrentPassword ? '🙉' : '🙈' }}

                        </button>

                    </div>

                </div>


                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label>
                        New Password
                    </label>

                    <div class="password-container">

                        <input [type]="
                showNewPassword
                  ? 'text'
                  : 'password'
              " formControlName="newPassword" placeholder="Enter new password">

                        <button type="button" class="eye-button" (click)="
                showNewPassword =
                !showNewPassword
              ">

                            {{ showNewPassword ? '🙉' : '🙈' }}

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label>
                        Confirm New Password
                    </label>

                    <div class="password-container">

                        <input [type]="
                showConfirmPassword
                  ? 'text'
                  : 'password'
              " formControlName="confirmPassword" placeholder="Confirm new password">

                        <button type="button" class="eye-button" (click)="
                showConfirmPassword =
                !showConfirmPassword
              ">

                            {{ showConfirmPassword ? '🙉' : '🙈' }}

                        </button>

                    </div>

                </div>


                <button type="submit" class="change-password-button" [disabled]="changingPassword">

                    {{ changingPassword
                    ? 'Changing...'
                    : 'Change Password'
                    }}

                </button>

            </form>

        </div>


        <!-- BACK -->

        <button type="button" class="back-button" (click)="goHome()">

            Back to Home

        </button>

    </div>

</div>
