<div class="profile-page">

    <div class="profile-card">

        <!-- ==========================================
             PROFILE HEADER
        =========================================== -->

        <div class="profile-header">

            <div class="profile-icon">
                👤
            </div>

            <div class="profile-user-info">

                <h2>
                    My Profile
                </h2>

                <p>
                    Manage your account
                </p>

            </div>

        </div>


        <!-- ==========================================
             MANAGE MY ACCOUNT
        =========================================== -->

        <div class="profile-option" routerLink="/manage-account">

            <div class="option-icon">
                👤
            </div>

            <div class="option-content">

                <h3>
                    Manage My Account
                </h3>

                <p>
                    View and edit your personal information
                </p>

            </div>

            <div class="option-arrow">
                →
            </div>

        </div>


        <!-- ==========================================
     SAVED ADDRESS
========================================== -->

        <div class="profile-option" routerLink="/saved-address">

            <div class="option-icon">
                📍
            </div>

            <div class="option-content">

                <h3>
                    My Saved Address
                </h3>

                <p>
                    Manage your saved delivery addresses
                </p>

            </div>

            <div class="option-arrow">
                →
            </div>

        </div>


        <!-- ==========================================
             MY ORDERS
        =========================================== -->

        <div class="profile-option">

            <div class="option-icon">
                📦
            </div>

            <div class="option-content">

                <h3>
                    My Orders
                </h3>

                <p>
                    View your order history
                </p>

            </div>

            <div class="option-arrow">
                →
            </div>

        </div>


        <!-- ==========================================
             LOGOUT
        =========================================== -->

        <div class="profile-option logout-option" (click)="onLogout()">

            <div class="option-icon logout-icon">
                🚪
            </div>

            <div class="option-content">

                <h3>
                    Logout
                </h3>

                <p>
                    Sign out from your account
                </p>

            </div>

            <div class="option-arrow logout-arrow">
                →
            </div>

        </div>


        <!-- ==========================================
             BACK TO HOME
        =========================================== -->

        <button type="button" class="back-button" (click)="goHome()">

            Back to Home

        </button>

    </div>

</div>
