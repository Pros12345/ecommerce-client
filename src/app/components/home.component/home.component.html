<!-- ==========================================
     HEADER
=========================================== -->

<header class="header">

  <!-- ==========================================
       LOGO
  =========================================== -->

  <div class="logo" routerLink="/home">

    <img src="assets/Logo.png" alt="Logo">

    <span>
      Ecommerce
    </span>

  </div>


  <!-- ==========================================
       SEARCH BAR
  =========================================== -->

  <div class="search-bar">

    <input type="text" placeholder="Search for products, brands and more" [(ngModel)]="searchText"
      (input)="searchProducts()">

  </div>


  <!-- ==========================================
       NAVIGATION
  =========================================== -->

  <nav class="nav-links">


    <!-- ========================================
         WHEN USER IS LOGGED IN
    ========================================= -->

    <ng-container *ngIf="isLoggedIn; else loggedOutMenu">


      <!-- ======================================
           ADD PRODUCT
      ======================================= -->

      <a *ngIf="canAddProduct" routerLink="/addProduct" class="nav-link">
        Add Product
      </a>


      <!-- ======================================
           CART
      ======================================= -->

      <a routerLink="/cart" class="nav-link">
        Cart
      </a>


      <!-- ======================================
           LOGOUT
      ======================================= -->

      <a (click)="onLogout()" class="nav-link logout-link">
        Logout
      </a>


      <!-- ======================================
           PROFILE
           THIS WILL BE THE RIGHTMOST ITEM
      ======================================= -->

      <div class="profile-menu" routerLink="/profile">
        <span class="profile-name">
          {{ userName }}
        </span>

        <div class="profile-avatar">
          🐵
        </div>

      </div>


    </ng-container>


    <!-- ========================================
         WHEN USER IS NOT LOGGED IN
    ========================================= -->

    <ng-template #loggedOutMenu>

      <a routerLink="/login" class="nav-link">
        Login
      </a>

      <a routerLink="/register" class="nav-link">
        Register
      </a>

      <a routerLink="/cart" class="nav-link">
        Cart
      </a>

    </ng-template>


  </nav>

</header>



<!-- ==========================================
     BANNER
=========================================== -->

<section class="banner-section">

  <div class="banner-container">

    <img src="assets/Banner.png" alt="Ecommerce Banner">

  </div>

</section>



<!-- ==========================================
     PRODUCTS SECTION
=========================================== -->

<section class="products-section">

  <h2>
    All Products
  </h2>


  <div class="products-grid">


    <!-- ======================================
         PRODUCT CARD
    ======================================= -->

    <div class="product-card" *ngFor="let product of products">


      <!-- ====================================
           IMAGE GALLERY
      ===================================== -->

      <div class="image-container">


        <!-- LEFT ARROW -->

        <button *ngIf="product.images && product.images.length > 1" class="arrow left" (click)="previousImage(product)">
          &#10094;
        </button>


        <!-- PRODUCT IMAGE -->

        <img *ngIf="
            product.images &&
            product.images.length > 0;
            else noImage
          " [src]="getCurrentImage(product)" [alt]="product.name">


        <!-- DEFAULT IMAGE -->

        <ng-template #noImage>

          <img src="assets/no-image.png" alt="No Image">

        </ng-template>


        <!-- RIGHT ARROW -->

        <button *ngIf="product.images && product.images.length > 1" class="arrow right" (click)="nextImage(product)">
          &#10095;
        </button>


      </div>



      <!-- ====================================
           IMAGE DOTS
      ===================================== -->

      <div class="image-dots" *ngIf="product.images && product.images.length > 1">

        <span *ngFor="
            let image of product.images;
            let i = index
          " class="dot" [class.active]="
            i === product.currentImageIndex
          " (click)="setCurrentImage(product, i)">
        </span>

      </div>



      <!-- ====================================
           PRODUCT NAME
      ===================================== -->

      <h3>
        {{ product.name }}
      </h3>



      <!-- ====================================
           DESCRIPTION
      ===================================== -->

      <div class="description">

        <p [class.expanded]="product.showMore">
          {{ product.description }}
        </p>


        <a *ngIf="product.description.length > 100" class="show-more" (click)="
            product.showMore = !product.showMore
          ">
          {{
          product.showMore
          ? 'Show Less'
          : 'Show More'
          }}
        </a>

      </div>



      <!-- ====================================
           STOCK
      ===================================== -->

      <p>

        In Stock:

        <strong>
          {{ product.quantity }}
        </strong>

      </p>



      <!-- ====================================
           STATUS
      ===================================== -->

      <p *ngIf="canAddProduct">

        Status:

        <strong>
          {{ product.status }}
        </strong>

      </p>



      <!-- ====================================
           PRICE
      ===================================== -->

      <div class="price">

        ₹{{ product.price }}

      </div>



      <!-- ====================================
           PRODUCT ACTIONS
      ===================================== -->

      <div class="product-actions">


        <!-- ADD TO CART -->

        <button class="primary-btn" *ngIf="
            product.quantity > 0 &&
            !isAdded(product)
          " (click)="addToCart(product)">
          Add To Cart
        </button>



        <!-- GO TO CART -->

        <button class="primary-btn" *ngIf="
            product.quantity > 0 &&
            isAdded(product)
          " routerLink="/cart">
          Go To Cart
        </button>



        <!-- OUT OF STOCK -->

        <button class="primary-btn out-of-stock" *ngIf="product.quantity === 0" disabled>
          Out of Stock
        </button>



        <!-- ==================================
             ADMIN ACTIONS
        =================================== -->

        <div class="admin-actions" *ngIf="
            isLoggedIn &&
            canAddProduct
          ">

          <button class="edit-btn" [routerLink]="[
              '/editProduct',
              product.id
            ]">
            Edit
          </button>


          <button class="delete-btn" (click)="deleteProduct(product.id)">
            Delete
          </button>

        </div>



        <!-- ==================================
             PERMANENT DELETE
        =================================== -->

        <button *ngIf="
            isLoggedIn &&
            canPermanentlyDelete
          " class="permanent-delete-btn" (click)="
            permanentlyDeleteProduct(product.id)
          ">
          Permanent Delete
        </button>


      </div>


    </div>

  </div>

</section>
