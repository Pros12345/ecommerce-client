<!-- Header Section -->
<header class="header fixed top-0 left-0 w-full bg-blue-600 p-4 flex items-center justify-between text-white">
  <div class="logo" routerLink="/home">
    <img src="assets/Logo.png" alt="Logo">
    <span>Ecommerce</span>
  </div>

  <div class="search-bar flex-grow mx-8">
    <input type="text" placeholder="Search for products, brands and more"
      class="w-full p-2 rounded border border-gray-300" [(ngModel)]="searchText" (input)="searchProducts()">
  </div>

  <nav class="nav-links space-x-6">

    <!-- Show these nav links only when NOT logged in -->
    <a *ngIf="!isLoggedIn" routerLink="/login" class="hover:underline">
      Login
    </a>

    <a *ngIf="!isLoggedIn" routerLink="/register" class="hover:underline">
      Sign up
    </a>

    @if (isLoggedIn) {

    <a (click)="onLogout()" class="hover:underline cursor-pointer">
      Logout
    </a>

    <a *ngIf="canAddProduct" routerLink="/addProduct" class="hover:underline">
      Add Product
    </a>
    <a routerLink="/cart" class="hover:underline">
      Cart
    </a>

    }

  </nav>
</header>

<!-- Banner Carousel Section -->
<section class="banner-section">
  <div class="banner-container">
    <img src="assets/Banner.png" alt="Ecommerce Banner">
  </div>
</section>

<!-- Products Section -->
<section class="products-section">

  <h2>All Products</h2>

  <div class="products-grid">

    <div class="product-card" *ngFor="let product of products">

      <!-- Product Image Gallery -->
      <div class="image-container">

        <!-- Left Arrow -->
        <button *ngIf="product.images && product.images.length > 1" class="arrow left" (click)="previousImage(product)">
          &#10094;
        </button>

        <!-- Product Image -->
        <img *ngIf="product.images && product.images.length > 0; else noImage" [src]="getCurrentImage(product)"
          [alt]="product.name">

        <!-- Default Image -->
        <ng-template #noImage>

          <img src="assets/no-image.png" alt="No Image">

        </ng-template>

        <!-- Right Arrow -->
        <button *ngIf="product.images && product.images.length > 1" class="arrow right" (click)="nextImage(product)">
          &#10095;
        </button>

      </div>

      <!-- Image Dots -->
      <div class="image-dots" *ngIf="product.images && product.images.length > 1">

        <span *ngFor="let image of product.images; let i = index" class="dot"
          [class.active]="i === product.currentImageIndex" (click)="setCurrentImage(product, i)">
        </span>

      </div>

      <!-- Product Name -->
      <h3>
        {{product.name}}
      </h3>

      <!-- Description -->
      <div class="description">

        <p [class.expanded]="product.showMore">
          {{ product.description }}
        </p>

        <a *ngIf="product.description.length > 100" class="show-more" (click)="product.showMore = !product.showMore">

          {{ product.showMore ? 'Show Less' : 'Show More' }}

        </a>

      </div>

      <!-- Quantity -->
      <p>
        In Stock :
        <strong>{{product.quantity}}</strong>
      </p>

      <p *ngIf="canAddProduct">
        Status:
        <strong>{{ product.status }}</strong>
      </p>

      <!-- Price -->
      <div class="price">
        ₹{{product.price}}
      </div>

      <div class="product-actions">

        <!-- Main Action -->
        <button class="primary-btn" *ngIf="product.quantity > 0 && !isAdded(product)" (click)="addToCart(product)">
          Add To Cart
        </button>

        <button class="primary-btn" *ngIf="product.quantity > 0 && isAdded(product)" routerLink="/cart">
          Go To Cart
        </button>

        <button class="primary-btn out-of-stock" *ngIf="product.quantity === 0" disabled>
          Out of Stock
        </button>

        <!-- Admin Actions -->
        <div class="admin-actions" *ngIf="isLoggedIn && canAddProduct">
          <button class="edit-btn" [routerLink]="['/editProduct', product.id]">
            Edit
          </button>

          <button class="delete-btn" (click)="deleteProduct(product.id)">
            Delete
          </button>

        </div>

        <!-- Permanent Delete -->
        <button *ngIf="isLoggedIn && canPermanentlyDelete" class="permanent-delete-btn"
          (click)="permanentlyDeleteProduct(product.id)">
          Permanent Delete
        </button>

      </div>

    </div>

  </div>

</section>
