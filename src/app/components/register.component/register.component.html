<!-- Error Popup -->
<div class="popup-overlay" *ngIf="showError">
    <div class="error-popup">
        <div class="popup-icon">
            ⚠
        </div>
        <h3>Registration Failed</h3>
        <p>
            {{ errorMessage }}
        </p>
        <button type="button" class="popup-button" (click)="closeErrorPopup()">
            OK
        </button>
    </div>
</div>

<div class="registration-container">

    <div class="registration-card">
        <!-- Header -->
        <div class="card-header">
            <div class="brand-logo">
                <span class="brand-icon">🛒</span>
                <span>MyStore</span>
            </div>
            <h2>Create Account</h2>
            <p>
                Sign up to start shopping with us
            </p>
        </div>


        <!-- Registration Form -->
        <form class="registration-form" [formGroup]="registrationForm" (ngSubmit)="onSubmit()">


            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input id="name" type="text" formControlName="firstName" placeholder="Enter your full name"
                    autocomplete="name">

                <div class="error-message"
                    *ngIf=" registrationForm.get('firstName')?.invalid && registrationForm.get('firstName')?.touched">
                    Please enter your name.
                </div>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input id="email" type="email" formControlName="email" placeholder="Enter your email"
                    autocomplete="email">

                <div class="error-message" *ngIf="
                        registrationForm.get('email')?.invalid &&
                        registrationForm.get('email')?.touched
                    ">

                    Please enter a valid email address.

                </div>

            </div>

            <!-- Mobile Number -->
            <div class="form-group">

                <label for="mobileNumber">
                    Mobile Number
                </label>

                <div class="mobile-input-container">

                    <!-- Country Code -->
                    <select id="countryCode" formControlName="countryCode">

                        <option value="+91">🇮🇳 +91</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+61">🇦🇺 +61</option>
                        <option value="+971">🇦🇪 +971</option>

                    </select>

                    <!-- Mobile -->
                    <input id="mobileNumber" type="tel" formControlName="mobileNumber" placeholder="Enter mobile number"
                        maxlength="10" autocomplete="tel" />

                </div>

                <div class="error-message" *ngIf="
            registrationForm.get('mobileNumber')?.invalid &&
            registrationForm.get('mobileNumber')?.touched
        ">
                    Please enter a valid 10 digit mobile number.
                </div>

            </div>

            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input id="password" type="password" formControlName="password" placeholder="Create a password"
                    autocomplete="new-password">

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input id="confirmPassword" type="password" formControlName="confirmPassword"
                    placeholder="Confirm your password" autocomplete="new-password">

            </div>


            <!-- Password mismatch -->
            <div *ngIf="
                    registrationForm.errors?.['passwordsMismatch'] &&
                    (
                        registrationForm.get('confirmPassword')?.dirty ||
                        registrationForm.get('confirmPassword')?.touched
                    )
                " class="error-message mismatch-error">

                <span>⚠</span>
                Passwords do not match.

            </div>


            <!-- Submit -->
            <button type="submit" class="signup-button" [disabled]="!registrationForm.valid">

                <span>CREATE ACCOUNT</span>

            </button>


            <!-- Login -->
            <div class="login-link">

                <p>
                    Already have an account?

                    <a routerLink="/login">
                        Log In
                    </a>
                </p>

            </div>


            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- Home -->
            <div class="home-link">
                <a routerLink="/home">
                    Back to Home
                </a>

            </div>

        </form>

    </div>

</div>
