<div class="registration-container">

    <div class="registration-card">

        <!-- Header -->
        <div class="card-header">

            <div class="brand-logo">
                <span class="brand-icon">🛒</span>
                <span>MyStore</span>
            </div>

            <h2>Create Account</h2>

            <p>
                Sign up to start shopping with us
            </p>

        </div>


        <!-- Registration Form -->
        <form class="registration-form" [formGroup]="registrationForm" (ngSubmit)="onSubmit()">


            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input id="name" type="text" formControlName="firstName" placeholder="Enter your full name"
                    autocomplete="name">

                <div class="error-message" *ngIf="
                        registrationForm.get('name')?.invalid &&
                        registrationForm.get('name')?.touched
                    ">

                    Please enter your name.

                </div>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input id="email" type="email" formControlName="email" placeholder="Enter your email"
                    autocomplete="email">

                <div class="error-message" *ngIf="
                        registrationForm.get('email')?.invalid &&
                        registrationForm.get('email')?.touched
                    ">

                    Please enter a valid email address.

                </div>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input id="password" type="password" formControlName="password" placeholder="Create a password"
                    autocomplete="new-password">

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input id="confirmPassword" type="password" formControlName="confirmPassword"
                    placeholder="Confirm your password" autocomplete="new-password">

            </div>


            <!-- Password mismatch -->
            <div *ngIf="
                    registrationForm.errors?.['passwordsMismatch'] &&
                    (
                        registrationForm.get('confirmPassword')?.dirty ||
                        registrationForm.get('confirmPassword')?.touched
                    )
                " class="error-message mismatch-error">

                <span>⚠</span>
                Passwords do not match.

            </div>


            <!-- Submit -->
            <button type="submit" class="signup-button" [disabled]="!registrationForm.valid">

                <span>CREATE ACCOUNT</span>

            </button>


            <!-- Login -->
            <div class="login-link">

                <p>
                    Already have an account?

                    <a routerLink="/login">
                        Log In
                    </a>
                </p>

            </div>


            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>


            <!-- Home -->
            <div class="home-link">

                <a routerLink="/home">
                    <span class="home-icon">⌂</span>
                    Back to Home
                </a>

            </div>

        </form>

    </div>

</div>
