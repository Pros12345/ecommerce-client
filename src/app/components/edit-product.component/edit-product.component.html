<div class="add-product-container">

    <h2>
        Edit Product
    </h2>


    <form [formGroup]="productForm" (ngSubmit)="updateProduct()" enctype="multipart/form-data">


        <!-- ======================================
             NAME
        ======================================= -->

        <div class="form-row">

            <label>
                Name:
            </label>

            <input type="text" formControlName="name" placeholder="Product Name">

        </div>


        <!-- ======================================
             DESCRIPTION
        ======================================= -->

        <div class="form-row">

            <label>
                Description:
            </label>

            <textarea rows="4" formControlName="description" placeholder="Product Description">
            </textarea>

        </div>


        <!-- ======================================
             QUANTITY
        ======================================= -->

        <div class="form-row">

            <label>
                Quantity:
            </label>

            <input type="number" formControlName="quantity" min="0">

        </div>


        <!-- ======================================
             PRICE
        ======================================= -->

        <div class="form-row">

            <label>
                Price:
            </label>

            <input type="number" formControlName="price" min="1">

        </div>


        <!-- ======================================
             STATUS
        ======================================= -->

        <div class="form-row">

            <label>
                Status:
            </label>

            <div class="status-group">

                <label>

                    <input type="radio" formControlName="status" value="Active">

                    Active

                </label>


                <label>

                    <input type="radio" formControlName="status" value="Inactive">

                    Inactive

                </label>

            </div>

        </div>


        <!-- ======================================
             EXISTING IMAGES
        ======================================= -->

        <div class="form-row">

            <label>
                Existing Images
            </label>


            <div class="selected-images" *ngIf="existingImages.length > 0">


                <div class="image-item" *ngFor="let image of existingImages" [class.primary-image]="
                        selectedPrimaryKey ===
                        'existing:' + image.id
                    ">


                    <!-- IMAGE -->

                    <img [src]="
                            'http://localhost:8080/api/images/' +
                            image.id
                        " [alt]="
                            image.fileName ||
                            'Product Image'
                        " class="product-image" loading="lazy" (error)="
                            $any($event.target).src =
                            'assets/Logo.png'
                        ">


                    <!-- FILE NAME -->

                    <span>

                        {{
                        image.fileName ||
                        'Product Image'
                        }}

                    </span>


                    <!-- PRIMARY -->

                    <label class="primary-option">

                        <input type="radio" name="primaryImage" [checked]="
                                selectedPrimaryKey ===
                                'existing:' + image.id
                            " (change)="
                                selectExistingPrimary(
                                    image.id
                                )
                            ">

                        Primary Image

                    </label>


                    <!-- DELETE -->

                    <button type="button" class="delete-btn" (click)="
                            removeExistingImage(
                                image
                            )
                        ">

                        Delete

                    </button>


                </div>

            </div>


            <!-- NO EXISTING IMAGES -->

            <div *ngIf="existingImages.length === 0" class="empty-images">

                No Existing Images

            </div>

        </div>


        <!-- ======================================
             NEW IMAGES
        ======================================= -->

        <div class="form-row">

            <label>
                Add New Images
            </label>


            <input #fileInput type="file" multiple accept="image/*" (change)="
                    onFileChange($event)
                ">

        </div>


        <!-- ======================================
             NEW IMAGE LIST
        ======================================= -->

        <div class="selected-images" *ngIf="selectedFiles.length > 0">


            <h4>
                New Images
            </h4>


            <div class="image-item" *ngFor="
                    let file of selectedFiles;
                    let i = index
                " [class.primary-image]="
                    selectedPrimaryKey ===
                    'new:' + i
                ">


                <!-- IMAGE -->

                <img [src]="getFilePreview(file)" [alt]="file.name" class="product-image">


                <!-- FILE NAME -->

                <span>

                    {{ file.name }}

                </span>


                <!-- PRIMARY -->

                <label class="primary-option">

                    <input type="radio" name="primaryImage" [checked]="
                            selectedPrimaryKey ===
                            'new:' + i
                        " (change)="
                            selectNewPrimary(i)
                        ">

                    Primary Image

                </label>


                <!-- REMOVE -->

                <button type="button" class="delete-btn" (click)="
                        removeNewImage(i)
                    ">

                    Remove

                </button>

            </div>

        </div>


        <!-- ======================================
             PRIMARY IMAGE INFORMATION
        ======================================= -->

        <div class="primary-message" *ngIf="selectedPrimaryKey">


            Primary Image:


            <!-- EXISTING PRIMARY -->

            <strong *ngIf="
                    selectedPrimaryKey
                        .startsWith('existing:')
                ">

                Existing Image

            </strong>


            <!-- NEW PRIMARY -->

            <strong *ngIf="
                    selectedPrimaryKey
                        .startsWith('new:')
                ">

                {{
                selectedFiles[
                +selectedPrimaryKey.split(':')[1]
                ]?.name
                }}

            </strong>

        </div>


        <!-- ======================================
             BUTTONS
        ======================================= -->

        <div class="button-group">


            <button type="submit" [disabled]="
                    productForm.invalid
                ">

                Update Product

            </button>


            <button type="button" class="cancel-btn" routerLink="/home">

                Cancel

            </button>

        </div>


        <!-- ======================================
             SUCCESS MESSAGE
        ======================================= -->

        <div class="form-row" *ngIf="uploadSuccess">

            <span class="success-message">

                Product Updated Successfully.

            </span>

        </div>


        <!-- ======================================
             HOME
        ======================================= -->

        <div class="home-link">

            <a routerLink="/home">

                Go to Home

            </a>

        </div>


        <!-- ======================================
             ERROR
        ======================================= -->

        <div class="form-row" *ngIf="uploadError">

            <span class="error-message">

                {{ uploadError }}

            </span>

        </div>


    </form>

</div>
