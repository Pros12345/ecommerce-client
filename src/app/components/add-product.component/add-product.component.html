<div class="add-product-container">
    <h2>Add New Product</h2>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
        <div class="form-row">
            <label>Name:</label>
            <input formControlName="name" type="text" placeholder="Product Name" required>
        </div>
        <div class="form-row">
            <label>Description:</label>
            <input formControlName="description" type="text" placeholder="Product Description">
        </div>
        <div class="form-row">
            <label>Quantity:</label>
            <input formControlName="quantity" type="number" min="1" placeholder="Quantity" required>
        </div>
        <div class="form-row">
            <label>Price:</label>
            <input formControlName="price" type="number" min="1" placeholder="price" required>
        </div>
        <div class="form-row">
            <label>Image:</label>
            <input type="file" (change)="onFileChange($event)" accept="image/*" required>
        </div>
        <div class="form-row">
            <button type="submit" [disabled]="productForm.invalid || !selectedFile">Add Product</button>
        </div>
        <div class="form-row" *ngIf="uploadSuccess">
            <span class="success-message">Product added successfully!</span>
        </div>
        <div class="form-row" *ngIf="uploadError">
            <span class="error-message">{{uploadError}}</span>
        </div>
    </form>
</div>
