<div class="login-container">

  <!-- ==========================================
       LOGIN FORM
  =========================================== -->

  <form class="login-card" [formGroup]="loginForm" (ngSubmit)="onLogin()">

    <!-- HEADER -->
    <div class="login-header">

      <div class="brand-logo">
        <span class="brand-icon">🛒</span>
        <span>MyStore</span>
      </div>

      <h2>Welcome Back</h2>

      <p>Login to continue shopping</p>

    </div>


    <!-- ==========================================
         EMAIL / MOBILE
    =========================================== -->

    <div class="form-group">

      <label for="identifier">
        Email or Mobile Number
      </label>

      <input id="identifier" type="text" formControlName="identifier" placeholder="Enter email or mobile number"
        autocomplete="username">

      <div class="error-message" *ngIf="
          loginForm.get('identifier')?.invalid &&
          loginForm.get('identifier')?.touched
        ">
        Please enter your email or mobile number.
      </div>

    </div>


    <!-- ==========================================
         PASSWORD
    =========================================== -->

    <div class="form-group">

      <label for="password">
        Password
      </label>

      <!-- Password wrapper -->
      <div class="password-container">

        <input id="password" [type]="showLoginPassword ? 'text' : 'password'" formControlName="password"
          placeholder="Enter your password" autocomplete="current-password">

        <!-- Eye Button -->
        <button type="button" class="eye-button" (click)="showLoginPassword = !showLoginPassword"
          [attr.aria-label]="showLoginPassword ? 'Hide password' : 'Show password'">
          {{ showLoginPassword ? '🙉' : '🙈' }}
        </button>

      </div>

      <div class="error-message" *ngIf="
          loginForm.get('password')?.invalid &&
          loginForm.get('password')?.touched
        ">
        Password is required.
      </div>

    </div>


    <!-- ==========================================
         LOGIN BUTTON
    =========================================== -->

    <button type="submit" class="login-button" [disabled]="!loginForm.valid">
      LOGIN
    </button>


    <!-- ==========================================
         REGISTER
    =========================================== -->

    <div class="registration-link">

      <p>
        Don't have an account?

        <a routerLink="/register">
          Sign Up
        </a>
      </p>

    </div>


    <!-- DIVIDER -->

    <div class="divider">
      <span>OR</span>
    </div>


    <!-- HOME -->

    <div class="home-link">

      <a routerLink="/home">
        Back to Home
      </a>

    </div>

  </form>


  <!-- ==========================================
       CUSTOM ERROR POPUP
  =========================================== -->

  <div class="error-overlay" *ngIf="showErrorPopup" (click)="closeErrorPopup()">

    <div class="error-popup" (click)="$event.stopPropagation()">

      <div class="error-icon">
        !
      </div>

      <h3>
        Login Failed
      </h3>

      <p>
        {{ errorMessage }}
      </p>

      <button type="button" class="error-ok-button" (click)="closeErrorPopup()">
        OK
      </button>

    </div>

  </div>

</div>
